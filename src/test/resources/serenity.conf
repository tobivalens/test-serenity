serenity.project.name = "PetStay"
serenity.take.screenshots = FOR_FAILURES
screenplay.pronouns = "él,ella,ellos,ellas,su,sus"
serenity.outputDirectory = target/site/serenity
webdriver.timeouts.implicitlywait = 60000
webdriver.timeouts.pageLoad = 60000
serenity.browser = chrome
serenity.environment = default
webdriver.base.url = "https://petstay-aphn.onrender.com"

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["--headless=new", "--window-size=1920,1080", "--no-sandbox", "--disable-dev-shm-usage"]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://petstay-aphn.onrender.com"
  }
}
